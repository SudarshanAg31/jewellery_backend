services:
  - type: web
    name: jewellery-backend
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn jewellery_backend.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: jewellery-db
          property: connectionString

databases:
  - name: jewellery-db
    plan: free
    databaseName: jewellery
    user: jewellery_user